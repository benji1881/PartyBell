name: release

on:
  push:
    branches: [main]
    paths: [plugin/**, android/**, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: 8.14.3

      - name: Version
        run: |
          last="$(git tag -l 'v0.1.*' | sort -V | tail -1)"
          last="${last:-v0.1.0}"
          echo "PREVIOUS=$last" >> "$GITHUB_ENV"
          echo "VERSION=0.1.$(( ${last##*.} + 1 ))" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Plugin
        run: |
          mkdir -p "$RUNNER_TEMP/dalamud"
          curl -sfL -o "$RUNNER_TEMP/dalamud.zip" https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q "$RUNNER_TEMP/dalamud.zip" -d "$RUNNER_TEMP/dalamud"
          DALAMUD_HOME="$RUNNER_TEMP/dalamud/" dotnet build plugin/PartyBell.csproj -c Release --nologo -p:EnableWindowsTargeting=true -p:Version="$VERSION"
          cp plugin/bin/Release/PartyBell/latest.zip "PartyBell-$VERSION.zip"

      - name: App
        env:
          KEYSTORE_BASE64: ${{ secrets.PARTYBELL_KEYSTORE_BASE64 }}
          PARTYBELL_KEYSTORE_PASSWORD: ${{ secrets.PARTYBELL_KEYSTORE_PASSWORD }}
        run: |
          export PARTYBELL_KEYSTORE="$RUNNER_TEMP/partybell.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$PARTYBELL_KEYSTORE"
          PARTYBELL_VERSION="$VERSION" PARTYBELL_VERSION_CODE="$VERSION_CODE" gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk "PartyBell-$VERSION.apk"

      - name: Repo
        run: |
          python3 -I - plugin/bin/Release/PartyBell/PartyBell.json "https://github.com/${{ github.repository }}/releases/download/v$VERSION/PartyBell-$VERSION.zip" <<'PY'
          import json, sys, time
          manifest = json.load(open(sys.argv[1]))
          manifest.update(
              DownloadLinkInstall=sys.argv[2],
              DownloadLinkUpdate=sys.argv[2],
              DownloadLinkTesting=sys.argv[2],
              AcceptsFeedback=False,
              IsHide=False,
              IsTestingExclusive=False,
              DownloadCount=0,
              LastUpdate=int(time.time()),
          )
          json.dump([manifest], open("repo.json", "w"), indent=2)
          PY

      - name: Release
        run: |
          git log "$PREVIOUS..HEAD" --no-merges --format="- %s" -- plugin android > notes.md
          gh release create "v$VERSION" "PartyBell-$VERSION.zip" "PartyBell-$VERSION.apk" repo.json --title "PartyBell $VERSION" --notes-file notes.md
